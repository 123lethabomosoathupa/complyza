server:
  port: ${PORT:8080}            # Render injects PORT
  shutdown: graceful

spring:
  application:
    name: comply-za
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:complyza}${DB_PARAMS:}
    username: ${DB_USER:complyza}
    password: ${DB_PASSWORD:complyza}
    hikari:
      maximum-pool-size: 5      # small managed DBs allow few connections
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    # Both the Ollama and OpenAI-compatible starters are on the classpath, so say which ones are active.
    # Everything we don't use is switched off, otherwise the OpenAI starter would demand an API key.
    model:
      chat: ollama
      embedding: ollama
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${CHAT_MODEL:llama3.2}
          temperature: 0.0
          num-ctx: 8192             # default context is too small for 6 sources
      embedding:
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}
    openai:
      api-key: ${GEMINI_API_KEY:not-set}   # only used when the gemini profile is active
    vectorstore:
      pgvector:
        initialize-schema: false  # Flyway owns the schema (see db/migration)
        dimensions: 768           # must match the embedding model and V1__init.sql
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      server:
        name: comply-za
        version: 0.1.0
        type: SYNC
        instructions: "Search South African regulations (POPIA, FIC Act) and get verbatim sections with section numbers."

app:
  security:
    admin-password: ${ADMIN_PASSWORD:admin-local}
    analyst-password: ${ANALYST_PASSWORD:analyst-local}
  retrieval:
    vector-top-k: 8
    similarity-threshold: 0.25
    keyword-top-k: 8
    final-top-k: 6
  disclaimer: >-
    Comply ZA explains what the source text says. It is not legal advice.
    Confirm against the official text and consult a qualified professional before acting.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    za.co.complyza: INFO

---
# Production: no default passwords. Startup fails if they are not set.
spring:
  config:
    activate:
      on-profile: prod
app:
  security:
    admin-password: ${ADMIN_PASSWORD}
    analyst-password: ${ANALYST_PASSWORD}

---
# Gemini via Google's OpenAI-compatible endpoint. Activate with SPRING_PROFILES_ACTIVE=prod,gemini
# Needs GEMINI_API_KEY. Model names can be changed with env vars if Google renames them.
spring:
  config:
    activate:
      on-profile: gemini
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com
      chat:
        completions-path: /v1beta/openai/chat/completions
        options:
          model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
          temperature: 0.0
      embedding:
        embeddings-path: /v1beta/openai/embeddings
        options:
          model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
          dimensions: 768          # must stay 768 to match the pgvector column
    retry:
      max-attempts: 6              # the free tier rate-limits (HTTP 429); wait and try again
      on-client-errors: true
      exclude-on-http-codes: [400, 401, 403, 404]
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 60s