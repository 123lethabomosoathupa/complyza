# Render Blueprint for Comply ZA: free web service only.
# The database lives in Neon, so there is no databases: block here.
# Frankfurt is the closest Render region to South Africa.

services:
  - type: web
    name: complyza
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,gemini
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        value: neondb_owner
      - key: DB_PARAMS
        value: "?sslmode=require"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:+ExitOnOutOfMemoryError"
      # Secrets: Render asks for these in the dashboard, they are never committed.
      - key: DB_HOST
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANALYST_PASSWORD
        sync: false